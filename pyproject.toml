[project]
name = "wingfoil-mcp"
version = "0.1.0"
description = "A lightweight MCP server exposing Airtable data as tools for AI assistants."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.84.0",
    "fastmcp>=3.1.0",
    "mcp[cli]>=1.26.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "black>=24.0",
    "isort>=5.13",
    "ruff>=0.9",
    "pre-commit>=4.0",
    "pytest>=8.0",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_third_party = ["requests", "mcp", "anthropic", "fastmcp"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]
ignore = [
    "D203",  # conflicts with D211 (no-blank-line-before-class)
    "D213",  # conflicts with D212 (multi-line-summary-second-line)
    "S101",  # allow assert in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
addopts = "--doctest-modules"
